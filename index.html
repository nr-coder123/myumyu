    <script>
      // Defensive fetch wrapper to prevent "Cannot set property fetch of #<Window> which has only a getter"
      // while guaranteeing that native fetch is always invoked with the Window context.
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var nativeFetch = window.fetch.bind(window);
            var activeFetch = nativeFetch;
            var safeFetchProxy = function() {
              return (activeFetch || nativeFetch).apply(window, arguments);
            };
            Object.defineProperty(window, 'fetch', {
              get: function() { return safeFetchProxy; },
              set: function(fn) {
                if (typeof fn === 'function') {
                  activeFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Fallback gracefully
        }
      })();
    </script>
